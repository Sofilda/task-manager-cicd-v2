# Учебный стенд Jenkins для ЛР №4 (вариант 2).
# Поднимает Jenkins LTS (JDK 21 + Maven) в Docker на runner-е GitHub Actions,
# создаёт Pipeline-задание из Jenkinsfile этого репозитория, выполняет
# контрольные сценарии выбора ветки и режима проверки (FULL / UNIT / COMPILE)
# и сохраняет журналы и скриншоты интерфейса Jenkins в ветку ci-evidence.

name: Jenkins demo (variant 2)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jenkins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Jenkins image (LTS, JDK 21, Maven, plugins)
        run: docker build -t lab-jenkins ci/jenkins

      - name: Start Jenkins
        run: |
          docker run -d --name jenkins -p 8080:8080 lab-jenkins
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/json > /dev/null; then echo "Jenkins is up"; exit 0; fi
            sleep 5
          done
          docker logs jenkins | tail -100
          exit 1

      - name: Install Playwright
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run scenarios and take screenshots
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: python ci/jenkins/run_demo.py

      - name: Publish evidence to branch ci-evidence
        if: always()
        env:
          GIT_AUTHOR_NAME: ci-evidence-bot
          GIT_AUTHOR_EMAIL: ci-evidence-bot
          GIT_COMMITTER_NAME: ci-evidence-bot
          GIT_COMMITTER_EMAIL: ci-evidence-bot
        run: |
          mkdir -p /tmp/evidence && cp -r evidence/. /tmp/evidence/ || true
          git checkout --orphan ci-evidence
          git rm -rf --quiet . || true
          cp -r /tmp/evidence/. .
          git add -A
          git commit -m "Jenkins evidence: logs and screenshots (run ${{ github.run_number }})"
          git push -f origin ci-evidence
